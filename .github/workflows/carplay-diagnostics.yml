name: CarPlay diagnostics beta
on:
  push:
    branches: [carplay-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        working-directory: VelaCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E 'error:' build.log | sort -u | head -40 || true
              tail -n 40 build.log
              exit 1
            }
          tail -n 5 build.log
      - name: Package development IPA
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Debug-iphoneos/Kite.app Payload/Kite.app
          codesign --force --sign - --timestamp=none Payload/Kite.app
          codesign --verify --deep --strict Payload/Kite.app
          zip -qr -X Kite-CarPlay-Diagnostics-Beta.ipa Payload
          unzip -tq Kite-CarPlay-Diagnostics-Beta.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Kite-CarPlay-Diagnostics-Beta
          path: Kite-CarPlay-Diagnostics-Beta.ipa
